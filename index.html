<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>the.hacken.ing</title>
  <meta name="description" content="the.hacken.ing">
  <style>
    :root {
      --bg: #fdfdfb;
      --fg: #1d1d1b;
      --muted: #6b6b66;
      --accent: #2f6f4f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --fg: #ececea;
        --muted: #9a9a94;
        --accent: #7fc4a0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 4rem 1rem;
    }
    h1 {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 2rem;
      margin: 0 0 1rem;
    }
    p { margin: 0 0 1rem; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>the.hacken.ing</h1>
    <p>Something is being hacked on here.</p>
    <p class="muted">Coming soon.</p>
  </main>
</body>
</html>
